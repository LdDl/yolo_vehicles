[package]
name = "vehicles-benchmark"
version = "0.1.0"
edition = "2021"
rust-version = "1.91"
description = "Compare six vehicle detectors on Junction + MIO-TCD"

[features]
default = ["ort-backend"]
ort-backend = ["od_opencv/ort-backend", "dep:ort"]
ort-cuda = ["ort-backend", "od_opencv/ort-cuda-backend"]

[dependencies]
od_opencv = { version = "=0.8.2", default-features = false, features = ["letterbox"] }
ort = { version = "=2.0.0-rc.12", optional = true }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
clap = { version = "4", features = ["derive"] }

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "benchmark"
path = "src/main.rs"
required-features = ["ort-backend"]
