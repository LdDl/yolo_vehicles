# YOLOv3-tiny for five-class Russian license plate detection.
# Architecture source: darknet/cfg/yolov3-tiny.cfg (AlexeyAB).
# Five classes: civilian, taxi, military, police, diplomatic.
# Before each [yolo] layer, filters=30 instead of 255: (classes + 5) * 3.
# Input is 320x192 with a 5:3 aspect ratio; letterbox preserves image proportions.
# The training script loads initial COCO weights for the first 11 layers via darknet partial.
# The training settings below are starting values for the new experiment.
# Augmentations and the learning-rate schedule are only used during training.

[net]
# Training: batch=64 and subdivisions=4, with 16 images per subdivision.
# Inference: batch=1 and subdivisions=1 in the matching -infer config.
batch=1
subdivisions=1
width=320
height=192
channels=3
momentum=0.9
decay=0.0005
# Augmentations: angle=0; saturation 1, exposure 1.3 and hue 0 preserve plate colors.
angle=0
saturation=1
exposure=1.3
hue=0

# Preserve text direction and class-specific plate colors.
flip=0
# Mosaic requires OpenCV and is incompatible with letter_box=1 in this Darknet fork.
# See the checks in load_data_detection() in darknet/src/data.c.
mosaic=0
# Letterbox resizing preserves image proportions and adds padding.
letter_box=1

# Base learning rate; warmup gradually increases it over the first 1000 iterations.
learning_rate=0.001
burn_in=1000
# Training budget: 10000 iterations, with learning-rate drops at 80% and 90%.
max_batches=10000
policy=steps
steps=8000,9000
scales=.1,.1

[convolutional]
batch_normalize=1
filters=16
size=3
stride=1
pad=1
activation=leaky

[maxpool]
size=2
stride=2

[convolutional]
batch_normalize=1
filters=32
size=3
stride=1
pad=1
activation=leaky

[maxpool]
size=2
stride=2

[convolutional]
batch_normalize=1
filters=64
size=3
stride=1
pad=1
activation=leaky

[maxpool]
size=2
stride=2

[convolutional]
batch_normalize=1
filters=128
size=3
stride=1
pad=1
activation=leaky

[maxpool]
size=2
stride=2

[convolutional]
batch_normalize=1
filters=256
size=3
stride=1
pad=1
activation=leaky

[maxpool]
size=2
stride=2

[convolutional]
batch_normalize=1
filters=512
size=3
stride=1
pad=1
activation=leaky

[maxpool]
size=2
stride=1

[convolutional]
batch_normalize=1
filters=1024
size=3
stride=1
pad=1
activation=leaky


[convolutional]
batch_normalize=1
filters=256
size=1
stride=1
pad=1
activation=leaky

[convolutional]
batch_normalize=1
filters=512
size=3
stride=1
pad=1
activation=leaky

[convolutional]
size=1
stride=1
pad=1
# Three anchors, each with 5 class scores and 5 box/objectness values.
filters=30
activation=linear

[yolo]
mask=3,4,5
anchors=10,14,  23,27,  37,58,  81,82,  135,169,  344,319
# Class order is defined in data/generated/plates.names.
classes=5
num=6
jitter=.3
ignore_thresh=.7
truth_thresh=1
# Random resizing during training: 1; fixed input size for inference: 0.
random=0
# CIoU loss for bounding box regression.
iou_loss=ciou
iou_normalizer=0.07
cls_normalizer=1.0

[route]
layers=-4

[convolutional]
batch_normalize=1
filters=128
size=1
stride=1
pad=1
activation=leaky

[upsample]
stride=2

[route]
layers=-1,8

[convolutional]
batch_normalize=1
filters=256
size=3
stride=1
pad=1
activation=leaky

[convolutional]
size=1
stride=1
pad=1
# Three anchors, each with 5 class scores and 5 box/objectness values.
filters=30
activation=linear

[yolo]
mask=0,1,2
anchors=10,14,  23,27,  37,58,  81,82,  135,169,  344,319
# Class order is defined in data/generated/plates.names.
classes=5
num=6
jitter=.3
ignore_thresh=.7
truth_thresh=1
# Random resizing during training: 1; fixed input size for inference: 0.
random=0
# CIoU loss for bounding box regression.
iou_loss=ciou
iou_normalizer=0.07
cls_normalizer=1.0
